<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服用チェック</title><style>
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#eaf7ff;background-size:cover;background-position:center;background-attachment:fixed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}.w{max-width:1180px;margin:auto;padding:12px;position:relative}.panel{backdrop-filter:blur(2px);background:#fff;border-radius:16px;padding:12px;margin:9px 0}h1{color:#0878bd}.notice{background:#fff7dc;border:1px solid #ead27b}.times{display:flex;gap:7px;flex-wrap:wrap}.times label{background:#eef9ff;border-radius:9px;padding:7px;font-size:12px}.nav{display:flex;align-items:center;justify-content:space-between;gap:6px}.cal{overflow-x:hidden}.month{width:100%;min-width:0}.week,.day{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(0,1fr));gap:2px}.week>*{background:#dff4ff;padding:6px 2px;text-align:center;font-size:10px;font-weight:bold;min-width:0}.day>*{background:#fff;border:1px solid #d9edf6;min-height:52px;padding:3px;min-width:0}.date{font-weight:bold;font-size:10px}.slot{text-align:center;display:flex;align-items:center;justify-content:center}.check{width:32px;height:32px;border:1px solid #9bcfe5;border-radius:8px;background:#f7fcff;padding:0;flex:0 0 auto}.check img{width:100%;height:100%;object-fit:contain}.slotLabel{display:none}.sub,.small{font-size:9px;color:#678}.pdfrow{display:flex;gap:7px;flex-wrap:wrap;align-items:end}.pdfrow input{display:block;padding:7px}.btn{border:0;border-radius:9px;padding:9px;background:#1686c9;color:white;font-weight:bold}.error{color:#a33}
@media(max-width:560px){.w{padding:7px}.panel{padding:8px}.cal{padding:7px}.month h2{font-size:18px;margin:5px 0 8px}.week{display:none}.day{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;border-top:2px solid #cde9f6;padding:5px 0}.day>.date{grid-column:1/-1;min-height:auto;border:0;background:#eef9ff;border-radius:8px;padding:5px 8px;text-align:left}.day>.slot{min-height:56px;border:1px solid #d9edf6;border-radius:8px;display:flex;flex-direction:column;gap:2px;padding:3px 1px}.slotLabel{display:block;font-size:8px;line-height:1.1;color:#567;white-space:nowrap}.check{width:34px;height:34px}.times label{font-size:11px;padding:6px}}
@media(max-width:360px){.day{grid-template-columns:repeat(3,minmax(0,1fr))}}
@page{size:A4 portrait;margin:8mm}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}.noPrint{display:none!important}.w{max-width:none;padding:0}.panel{padding:0;margin:0;border-radius:0;box-shadow:none}.cal{overflow:visible}.month{width:100%;min-width:0;page-break-after:always;break-after:page}.month:last-child{page-break-after:auto;break-after:auto}.month h2{font-size:14px;margin:0 0 4px}.week,.day{display:grid;grid-template-columns:42px repeat(var(--cols),minmax(0,1fr));gap:1px}.week>*{padding:2px 1px;font-size:7.5pt;line-height:1.05}.day>*{min-height:22px;height:22px;padding:1px}.date{font-size:7pt;line-height:1.05}.sub{font-size:6pt;line-height:1}.slot{display:flex;align-items:center;justify-content:center}.slotLabel{display:none!important}.check{width:18px;height:18px;border-radius:4px}.check img{width:100%;height:100%;object-fit:contain}}</style></head><body><div class="w">
<h1>💊 服用チェック</h1><div class="panel notice noPrint small">このページの記録はブラウザ内に保存されます。端末・ブラウザごとに異なり、ブラウザデータの削除や端末変更などで消える場合があります。</div>
<div id="load" class="panel noPrint small">🐠 スタンプ画像を読み込み中...</div><div class="panel noPrint"><b>表示する服用時点</b><div id="timeOpts" class="times"></div></div>
<div class="panel noPrint nav"><button class="btn" id="prev">←</button><b id="label"></b><button class="btn" id="next">→</button></div><div id="calendar" class="panel cal"></div>
<div class="panel noPrint"><b>📄 PDF用期間</b><div class="pdfrow"><label>開始月<input type="month" id="from"></label><label>終了月<input type="month" id="to"></label><button class="btn" id="printBtn">印刷 / PDF保存</button></div></div><div class="noPrint"><a id="back">← MARINE PORTALへ戻る</a></div></div>
<script>
const JSON_URL="../MARINE-CHARACTERS/characters.json",PORTAL="https://marine-pharmacy0963.github.io/MARINE-TRICK/",PORTAL_CONFIG="../marine-theme.json",ORDER=["character_mu0401sd_t9k8k","character_mu0415ns_aljp2"],OVERRIDES={},ALLOW_IMAGE_SAVE=true,KEY="marine_medicine_checks_v3",SETKEY="marine_medicine_slots_v1";function normChar(x){const image=(typeof x?.image==="string"&&x.image)||(typeof x?.src==="string"&&x.src)||"";const med=!!(x?.uses?.medicine??x?.medicine);return {...x,active:x?.active!==false,image,uses:{...(x?.uses||{}),medicine:med}}}function medChars(j){return (j?.characters||j?.chars||[]).map(normChar).filter(x=>x.active&&x.uses.medicine)}
const slots=[["wake","起床時",""],["breakfast_pre","朝","食前"],["breakfast_post","朝","食後"],["lunch_pre","昼","食前"],["lunch_post","昼","食後"],["dinner_pre","夕","食前"],["dinner_post","夕","食後"],["bed","寝る前",""]];
let CHARS=[],enabled,checks,view=new Date();view=new Date(view.getFullYear(),view.getMonth(),1);
try{enabled=JSON.parse(localStorage.getItem(SETKEY)||"null")}catch(e){}if(!enabled)enabled=Object.fromEntries(slots.map(x=>[x[0],true]));
try{checks=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){checks={}}
function save(){localStorage.setItem(KEY,JSON.stringify(checks));localStorage.setItem(SETKEY,JSON.stringify(enabled))}
function opts(){timeOpts.innerHTML="";slots.forEach(s=>{let l=document.createElement("label");l.innerHTML='<input type="checkbox" data-slot="'+s[0]+'" '+(enabled[s[0]]?"checked":"")+'> '+s[1]+(s[2]?" "+s[2]:"");timeOpts.appendChild(l)});timeOpts.querySelectorAll("input").forEach(x=>x.onchange=()=>{enabled[x.dataset.slot]=x.checked;save();draw()})}
function dim(y,m){return new Date(y,m+1,0).getDate()}function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}function img(id){return CHARS.find(x=>x.id===id)?.image||""}
function drawMonth(d,target){let y=d.getFullYear(),m=d.getMonth(),active=slots.filter(s=>enabled[s[0]]),box=document.createElement("div");box.className="month";box.style.setProperty("--cols",active.length);box.innerHTML="<h2>"+y+"年 "+(m+1)+"月</h2>";let w=document.createElement("div");w.className="week";w.innerHTML="<div>日付</div>"+active.map(s=>"<div>"+s[1]+'<div class="sub">'+s[2]+"</div></div>").join("");box.appendChild(w);for(let day=1;day<=dim(y,m);day++){let ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0"),row=document.createElement("div");row.className="day";row.innerHTML='<div class="date">'+day+'日<br><span class="sub">'+["日","月","火","水","木","金","土"][new Date(y,m,day).getDay()]+"</span></div>";active.forEach(s=>{let c=document.createElement("div");c.className="slot";let lab=document.createElement("span");lab.className="slotLabel";lab.textContent=s[1]+(s[2]?" "+s[2]:"");let b=document.createElement("button");b.className="check";let rec=checks[ds]?.[s[0]],src=rec?img(rec.characterId):"";if(src)b.innerHTML='<img draggable="false" src="'+src+'">';else if(rec)b.textContent="✓";b.onclick=()=>{checks[ds]??={};if(checks[ds][s[0]])delete checks[ds][s[0]];else{let pool=CHARS.filter(x=>x.active&&x.uses?.medicine&&x.image),pick=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;checks[ds][s[0]]={characterId:pick?pick.id:null,time:new Date().toISOString()}}save();draw()};c.appendChild(lab);c.appendChild(b);row.appendChild(c)});box.appendChild(row)}target.appendChild(box)}
function draw(){calendar.innerHTML="";label.textContent=view.getFullYear()+"年 "+(view.getMonth()+1)+"月";drawMonth(view,calendar);from.value=from.value||ym(view);to.value=to.value||ym(view)}
prev.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);draw()};next.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);draw()};
printBtn.onclick=()=>{let a=from.value.split("-").map(Number),z=to.value.split("-").map(Number);if(!a[0]||!z[0])return;calendar.innerHTML="";let d=new Date(a[0],a[1]-1,1),end=new Date(z[0],z[1]-1,1);while(d<=end){drawMonth(d,calendar);d=new Date(d.getFullYear(),d.getMonth()+1,1)}setTimeout(()=>window.print(),100)};
async function applyPortalBackground(){try{let r=await fetch(PORTAL_CONFIG,{cache:"no-store"});if(!r.ok)throw Error();let j=await r.json();let bg=j.backgroundImage||j.background||j.bgImage||j.portalBackground||j?.theme?.backgroundImage||"";if(bg){try{bg=new URL(bg,PORTAL_CONFIG).href}catch(e){}document.body.style.backgroundImage="linear-gradient(#eaf7ff55,#eaf7ff55),url(\""+bg+"\")"}}catch(e){}}
async function boot(){applyPortalBackground();try{let r=await fetch(JSON_URL,{cache:"no-store"});if(!r.ok)throw Error();let j=await r.json(),raw=medChars(j),map=Object.fromEntries(raw.map(x=>[x.id,x]));CHARS=[...ORDER.map(id=>map[id]).filter(Boolean),...raw.filter(x=>!ORDER.includes(x.id))];CHARS=CHARS.map(x=>OVERRIDES[x.id]?.dataUrl?{...x,image:OVERRIDES[x.id].dataUrl}:x);load.textContent="🐠 "+CHARS.length+"キャラのランダムスタンプを読み込みました。"}catch(e){load.innerHTML='<span class="error">⚠️ スタンプ画像を読み込めませんでした。チェック記録自体は使用できます。</span>'}if(!ALLOW_IMAGE_SAVE){document.addEventListener("contextmenu",e=>{if(e.target.closest("img"))e.preventDefault()});document.addEventListener("dragstart",e=>{if(e.target.closest("img"))e.preventDefault()});document.querySelectorAll("img").forEach(x=>x.draggable=false)}opts();draw()}
back.href=PORTAL;boot();
</script></body></html>
